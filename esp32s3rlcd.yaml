#=============================================================
# Basic Configuration
#=============================================================

substitutions:
  name: "waveshare-esp32-s3-rlcd-42"
  friendly_name: "Waveshare ESP32-S3-RLCD-4.2"

.variables:
  - &weather_entity "weather.city"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"

  on_boot:
    - priority: 999.0
      then:
        - lambda: |-
            id(deep_sleep_1).set_sleep_duration(id(deep_sleep_sleep_duration).state * 60 * 60 * 1000);
            id(deep_sleep_1).set_run_duration(90 * 1000);
        - if:
            condition:
              or:
                - binary_sensor.is_on: ota_mode
                - switch.is_on: prevent_sleep
            then:
              - lambda: |- 
                  ESP_LOGW("Apollo", "Preventing Deep Sleep Due To OTA On Boot");
                  id(deep_sleep_1).prevent_deep_sleep();

  on_shutdown:
    then:
      - switch.turn_off: speaker_enable # Coupe l'alimentation de l'ampli audio
      - micro_wake_word.stop:
      - globals.set:
          id: gtemp
          value: !lambda 'return id(temp_sensor).state;'
      - globals.set:
          id: ghum
          value: !lambda 'return id(hum_sensor).state;'
      - globals.set:
          id: gbat
          value: !lambda 'return id(bat_level).state;' 
      - globals.set:
          id: gvolt
          value: !lambda 'return id(bat_voltage).state;'
      - if:
          condition:
            lambda: 'return id(ha_weather_temperature).has_state();'
          then:
            - globals.set:
                id: gweather_temp
                value: !lambda 'return id(ha_weather_temperature).state;' 
      - if:
          condition:
            lambda: 'return id(ha_weather_humidity).has_state();'
          then:
            - globals.set:
                id: gweather_hum
                value: !lambda 'return id(ha_weather_humidity).state;'
      - if:
          condition:
            lambda: 'return id(ha_weather_wind).has_state();'
          then:
            - globals.set:
                id: gweather_wind
                value: !lambda 'return id(ha_weather_wind).state;'

psram:
  mode: octal
  speed: 80MHz

logger:

wifi:
  id: wifi_component
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true # Se connecte directement sans scanner tous les canaux
  manual_ip:
    static_ip: 192.168.0.102 # Remplacez par une IP libre de votre réseau
    gateway: 192.168.0.254
    subnet: 255.255.255.0
  on_connect:
    - pcf85063.write_time:
    - component.update: my_display
  on_disconnect:
    - component.update: my_display

#=============================================================
# Globals
#=============================================================

globals:
  - id: gtemp
    type: float
    restore_value: yes
    initial_value: "0.0"
  - id: ghum
    type: float
    restore_value: yes
    initial_value: "0.0"
  - id: gbat
    type: float
    restore_value: yes
    initial_value: "0.0"
  - id: gvolt
    type: float
    restore_value: yes
    initial_value: "0.0"
  - id: gweather
    type: int
    restore_value: yes
    initial_value: "0"
  - id: gweather_temp
    type: float
    restore_value: yes
    initial_value: "-999.0"
  - id: gweather_hum
    type: float
    restore_value: yes
    initial_value: "-1.0"
  - id: gweather_wind
    type: float
    restore_value: yes
    initial_value: "-1.0"
  - id: gweather_wind_dir
    type: int
    restore_value: yes
    initial_value: "-1"
  - id: gweather_next
    type: std::string
    restore_value: yes
    initial_value: '"--"'
    
#=============================================================
# RTC
#=============================================================

time:
  - platform: pcf85063
    # repeated synchronization is not necessary unless the external RTC
    # is much more accurate than the internal clock
    update_interval: never
  - platform: homeassistant
    id: esptime
    # instead try to synchronize via network repeatedly ...
    on_time_sync:
      then:
        # ... and update the RTC when the synchronization was successful
        pcf85063.write_time:
    
#=============================================================
# I2C Bus Shared by SHTC3 sensor, ES8311 DAC, and ES7210 ADC
#=============================================================
    
i2c:
  sda: GPIO13
  scl: GPIO14
  scan: true
  id: bus_a


#=============================================================
# Display — ST7305 RLCD (Waveshare ESP32-S3-RLCD-4.2)
#=============================================================

spi:
  clk_pin: GPIO11
  mosi_pin: GPIO12

font:
